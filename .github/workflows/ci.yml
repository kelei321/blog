name: Blog CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        run: pnpm check

      - name: Type check
        run: pnpm type-check

      - name: Build site
        run: pnpm build
